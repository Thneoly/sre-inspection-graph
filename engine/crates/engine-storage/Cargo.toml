[package]
name = "engine-storage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Storage backends — SQLite (default) + Parquet + optional Neo4j adapter"

[features]
default = ["sqlite", "parquet"]
sqlite  = ["dep:sqlx"]
parquet = []
neo4j   = []

[dependencies]
engine-core     = { workspace = true }
engine-identity = { workspace = true }
engine-recovery = { workspace = true }
engine-changes  = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
anyhow      = { workspace = true }
sqlx        = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
