# CI —— 三个 workspace(engine / modules / desktop)+ 前端的 gate 矩阵。
#
# 由 ops/ci.yml.draft 正式化而来,三处升级:
# 1. 加 windows job —— Windows 兼容是本项目真实卖点(fs-read canonicalize、
#    kubectl 解析、日志目录等一批修复只在 Windows 上可验证;Linux runner
#    全绿不代表 Windows 不挂,2026-10 的修复轮就是这么漏掉的)。
# 2. 加 frontend job(tsc + vitest)—— draft 只有 Rust 侧。
# 3. 删 fmt step —— 三个 workspace 均未采用 rustfmt(手写紧凑风格,全文
#    格式化会产生数千行 diff 抹掉作者风格;是否引入 rustfmt 留给作者决定)。
#    删 lockfile job —— 各 job 已 --locked,单独 job 重复编译。
#
# 注:
# - engine 测试在 windows 上限 -j 2:linking wasmtime 测试二进制的内存峰值
#   高,并行会把 rustc 打崩(本机 32GB 也翻过车,runner 更小)。
# - desktop 的 spawn 型测试已 #[cfg(unix)](sleep/true//proc 是 unix 语义),
#   windows 跑纯函数 + 平台无关测试。
# - modules-wasip3 保持 experimental(continue-on-error,见 draft 注释)。

name: CI

on:
  push:
    branches: [main, "phase*/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # =====================================================================
  # engine/ — Rust workspace(8 业务 + 2 基建 crate)
  # =====================================================================
  engine:
    name: engine — check / test / clippy (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: engine

      - name: cargo check --all-targets
        run: cargo check --all-targets --locked

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace --locked

  # =====================================================================
  # modules/ — WASM workspace
  #   host  : cargo check / clippy / test(mapper 纯函数,sdk 单测)
  #   wasip2: cargo build --release --target wasm32-wasip2(Tier 2 stable,
  #           manifest.toml 指向的产物从这里出)
  # =====================================================================
  modules:
    name: modules — host check / test / clippy (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: modules

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules
          key: modules-host

      - name: cargo check --all-targets
        run: cargo check --all-targets --locked

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

  modules-wasip2:
    name: modules — clippy + build wasm32-wasip2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: modules

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain + wasip2 target
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-wasip2

      - name: Cache cargo (wasip2)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules
          key: modules-wasip2

      - name: cargo clippy --target wasm32-wasip2 -- -D warnings
        run: cargo clippy --target wasm32-wasip2 --all-targets --locked -- -D warnings

      - name: cargo build --release --target wasm32-wasip2
        run: cargo build --release --target wasm32-wasip2 --locked

      - name: Verify wasm artifacts
        run: ls -lh target/wasm32-wasip2/release/*.wasm

  # experimental:wasm32-wasip3(Tier 3,nightly + build-std)—— 失败不阻塞
  # PR;wasip3 升 Tier 2 后转正(删 continue-on-error、toolchain 改 stable)。
  modules-wasip3:
    name: modules — build wasm32-wasip3 (experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    defaults:
      run:
        working-directory: modules

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly + rust-src
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache cargo (wasip3 nightly)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules
          key: modules-wasip3

      - name: cargo build --target wasm32-wasip3 (build-std)
        run: |
          cargo +nightly build --release \
            --target wasm32-wasip3 \
            -Z build-std=std,panic_abort \
            --locked

  # =====================================================================
  # frontend — tsc + vitest(不依赖 Rust,快)
  # =====================================================================
  frontend:
    name: frontend — tsc + vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      - name: tsc --noEmit
        run: npx tsc --noEmit

      - name: vitest
        run: npm test

  # =====================================================================
  # desktop/src-tauri — Tauri Rust 后端(Linux runner)
  # =====================================================================
  desktop:
    name: desktop — backend check / clippy (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop/src-tauri

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKit / GTK deps for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            javascriptcoregtk-4.1 \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: desktop

      - name: cargo check --all-targets
        run: cargo check --all-targets --locked

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets --locked -- -D warnings

  # =====================================================================
  # windows —— Windows 兼容是真实卖点(2026-10 修复轮的主战场),必须有
  # 独立 gate。engine 测试限 -j 2(linking wasmtime 测试的内存峰值;并行
  # 会把 rustc 打崩 —— 32GB 本机也翻过车,runner 内存更紧)。
  # =====================================================================
  windows:
    name: windows — engine + desktop tests
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: engine cargo test --workspace (-j 2, linking memory)
        run: cargo test --workspace --locked -j 2
        working-directory: engine
        env:
          CARGO_BUILD_JOBS: 2

      - name: desktop cargo test --lib
        run: cargo test --lib --locked
        working-directory: desktop/src-tauri
