[package]
name = "prometheus"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Prometheus connector — GET /api/v1/query via http-client capability, emits metric Facts"

[lib]
# cdylib 出 wasm32-wasip2 二进制;rlib 让 host 端单测可链接(全部逻辑在
# cfg(target_arch = "wasm32") 里,host 端 lib 实际是空 crate)。
crate-type = ["cdylib", "rlib"]

[package.metadata.component]
package = "sre:inspection-prometheus@0.1.0"

[package.metadata.component.target]
path  = "../../../specs/wit"
world = "connector-world"

[dependencies]
module-sdk  = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
wit-bindgen = { workspace = true }
