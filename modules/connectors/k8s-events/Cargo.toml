[package]
name = "k8s-events"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "K8s Events connector — GET /api/v1/.../events via http-client, maps ScalingReplicaSet/SuccessfulRescale into kind=\"change\" Facts"

[lib]
# cdylib 出 wasm32-wasip2 二进制;rlib 让 host 端 mapper 单测可链接。
crate-type = ["cdylib", "rlib"]

[package.metadata.component]
package = "sre:inspection-k8s-events@0.1.0"

[package.metadata.component.target]
path  = "../../../specs/wit"
world = "connector-world"

[dependencies]
module-sdk  = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
wit-bindgen = { workspace = true }
