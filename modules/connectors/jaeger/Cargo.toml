[package]
name = "jaeger"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Jaeger trace connector — GET /api/traces via http-client, aggregates CHILD_OF spans into CALLS topology-edge Facts"

[lib]
# cdylib 出 wasm32-wasip2 二进制;rlib 让 host 端 mapper 单测可链接(全部 wasm
# 逻辑在 cfg(target_arch = "wasm32") 里,host 端 lib 只剩 mapper)。
crate-type = ["cdylib", "rlib"]

[package.metadata.component]
package = "sre:inspection-jaeger@0.1.0"

[package.metadata.component.target]
path  = "../../../specs/wit"
world = "connector-world"

[dependencies]
module-sdk  = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
wit-bindgen = { workspace = true }
