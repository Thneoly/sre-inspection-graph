[package]
name = "alertmanager"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Alertmanager v2 alerts connector — active alerts as live alert facts"

[lib]
# cdylib 出 wasm32-wasip2;rlib 让 host 端单测链接 mapper 纯函数(同 k8s/k8s-events 模式)
crate-type = ["cdylib", "rlib"]

[package.metadata.component]
package = "sre:inspection-alertmanager@0.1.0"

[package.metadata.component.target]
path  = "../../../specs/wit"
world = "connector-world"

[dependencies]
module-sdk  = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
wit-bindgen = { workspace = true }
