services:
  neo4j:
    image: neo4j:5-community
    container_name: sre-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-sre-inspection}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_directories_import: /import
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - import_data:/import
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-sre-inspection} 'RETURN 1' || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  neo4j-init:
    image: neo4j:5-community
    container_name: sre-neo4j-init
    depends_on:
      neo4j:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "Copying L1/L2 CSV files to import dir..."
        cp /l1l2-data/*.csv /import/ 2>/dev/null || true
        echo "Copying L3/L4 CSV files to import dir..."
        cp /l3l4-data/*.csv /import/ 2>/dev/null || true
        echo "Files in import:"
        ls -la /import/
        echo "Importing L1/L2 data..."
        cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-sre-inspection} -a bolt://neo4j:7687 \
          -f /scripts/neo4j_import_cloud_native_app_inspection_graph_v1.cypher || true
        echo "Importing L3/L4 data..."
        cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-sre-inspection} -a bolt://neo4j:7687 \
          -f /l3l4-data/neo4j_import_l3_l4_v1.cypher || true
        echo "Neo4j initialization complete."
    volumes:
      - ./datas/cloud_native_app_inspection_graph_import_package_v1:/l1l2-data:ro
      - ./scripts/output:/l3l4-data:ro
      - ./scripts:/scripts:ro
      - import_data:/import

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sre-api
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-sre-inspection}
    depends_on:
      neo4j-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    container_name: sre-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  import_data:
