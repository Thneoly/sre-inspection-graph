[package]
name = "sre-graph-desktop"
version = "0.4.0"
edition = "2021"
description = "SRE Inspection Graph — Tauri 2.x desktop app"
license = "MIT OR Apache-2.0"

# 与 engine/ workspace 隔离 — desktop 编译链(tauri、webview2-com)较重,
# 不污染 engine 增量 build。
[workspace]

# release 体积/性能:wasmtime+webview2 默认 release 不 strip 不 LTO,exe 白背
# 几十 MB 符号(实测 48MB)。对齐 engine workspace 的 profile 写法。
# 注意:engine/modules 各自 workspace 的 profile 不随 path dep 传到这里,须单独声明。
[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[lib]
name = "sre_graph_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sre-graph-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# Tauri 核心(2026-06 最新)
tauri        = { version = "2.11", features = [] }
tauri-plugin-shell = "2.3"
# 单实例防护:双开 exe 会双写同一 SQLite 与 materialized 拓扑(两个 sync loop
# 各自 upsert,last-writer-wins)+ 双起 kubectl proxy(端口冲突)。官方插件,
# 二次启动回调里聚焦已有窗口。
tauri-plugin-single-instance = "2"
# 首启致命错误弹窗(setup 失败时展示原因,替代静默闪退 —— 最需要日志的时刻
# 恰好还没有窗口可以显示任何东西)。
tauri-plugin-dialog = "2"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"

# 启动 wasm runtime 时的错误处理 + 日志
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Phase 6 observability — 日志落盘 + 按天轮转(tracing writer,与现有 fmt 并存)
tracing-appender   = "0.2"
# Phase 3.6 - alert event ID 生成(already transitively in lock via tauri)
uuid = { version = "1", features = ["v4"] }

# Phase 2.7 - kubectl proxy 生命周期托管(process)+ 就绪探测(net/time)。
# Tauri 已拉 tokio 1.x,这里显式启用 process/net/time/sync 特性;Cargo 特性合并。
tokio = { version = "1", features = ["process", "net", "time", "sync", "rt-multi-thread", "macros"] }

# engine path deps(按 doc/16 §3 配置)
engine-core     = { path = "../../engine/crates/engine-core" }
engine-identity = { path = "../../engine/crates/engine-identity" }
engine-storage  = { path = "../../engine/crates/engine-storage" }
engine-wasm     = { path = "../../engine/crates/engine-wasm" }
engine-recovery = { path = "../../engine/crates/engine-recovery" }
engine-changes  = { path = "../../engine/crates/engine-changes" }
engine-reports  = { path = "../../engine/crates/engine-reports" }
async-trait = "0.1"
chrono = "0.4"
# Phase 4.3 - SMTP 发送(SmtpEmailSender;InMemory 回退在 engine-reports)
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1-native-tls", "hostname"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
